<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Entity streaming over a server - Isogenic Engine</title>
	<script src="./index.bundle.js" type="module"></script>
	<style>
		body {
			margin: 0;
			padding: 0;
			background: #0b0e14;
			color: #ccc;
			font-family: monospace;
			overflow: hidden;
		}
		canvas {
			display: block;
			width: 100vw;
			height: 100vh;
		}
		#info {
			position: absolute;
			top: 8px;
			right: 8px;
			background: rgba(0, 0, 0, 0.7);
			padding: 8px 12px;
			border-radius: 4px;
			line-height: 1.5;
			font-size: 12px;
		}
	</style>
</head>
<body>
	<canvas id="view"></canvas>
	<div id="info">
		<b>Entity streaming over a server</b><br />
		WASD or arrow keys steer your ship. Open more tabs to add pilots.<br />
		Start the server first (src/examples/entityStreamNet/server/server.ts).<br />
		<span id="status">Connecting...</span>
	</div>
</body>
</html>
