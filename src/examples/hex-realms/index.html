<!DOCTYPE html>
<html lang="en">
<head>
	<meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
	<meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport" />
	<meta content="https://www.isogenicengine.com" name="game-engine-origin" />
	<title>Hex Realms - Isogenic Engine</title>
	<link href="../../css/ige.css" media="all" rel="stylesheet" type="text/css" />
	<script src="./index.bundle.js" type="module"></script>
	<style>
		:root {
			--bg: rgba(10, 16, 26, 0.86);
			--line: rgba(255, 255, 255, 0.12);
			--text: #e6edf5;
			--dim: #93a4b8;
			--accent: #2f6fd6;
			--good: #7ee08a;
			--bad: #ff7a7a;
			--warn: #ffcc66;
			--gold: #ffd76a;
		}
		body { margin: 0; overflow: hidden; background: #0e1724; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); user-select: none; }
		.panel { position: absolute; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; z-index: 100; font-size: 13px; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35); }
		.hidden { display: none !important; }
		.dim { color: var(--dim); }
		.small { font-size: 11px; }
		.good { color: var(--good); }
		.bad { color: var(--bad); }
		.warn { color: var(--warn); }
		.stars { color: var(--gold); font-weight: 600; }
		.swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(255, 255, 255, 0.5); }
		.badge { display: inline-block; background: #e5484d; color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
		.good-chip, .good { display: inline-block; }
		.chip { display: inline-block; color: var(--text); background: color-mix(in srgb, var(--c) 35%, transparent); border: 1px solid var(--c); border-radius: 5px; padding: 0 5px; margin: 1px 2px 1px 0; font-size: 11px; }
		a { color: #9fd3ff; }

		button, select, input { font: inherit; color: var(--text); background: #23344b; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 6px; padding: 5px 10px; }
		button { cursor: pointer; }
		button small { display: block; color: var(--dim); font-size: 10px; }
		button:hover:not(:disabled), select:hover { background: #2d4463; }
		button:disabled { opacity: 0.42; cursor: default; }
		button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
		button.primary { background: var(--accent); border-color: #5b93ee; font-weight: 600; }
		button.primary:hover:not(:disabled) { background: #3a7ce6; }
		button.danger { background: #6b2328; border-color: #b0434b; }
		button.ghost { background: transparent; }
		button.mini { padding: 1px 7px; font-size: 11px; }
		button.mini.on { background: var(--accent); }
		button.big { font-size: 16px; padding: 10px 22px; }

		#topbar { top: 8px; left: 8px; right: 8px; display: flex; align-items: center; gap: 10px; padding: 6px 10px; flex-wrap: wrap; }
		#topbar .title { font-weight: 700; letter-spacing: 1px; color: var(--gold); }
		#topbar .spacer { flex: 1; }

		#infoPanel { left: 8px; bottom: 8px; width: 380px; max-width: calc(100vw - 16px); max-height: 55vh; overflow-y: auto; padding: 8px 10px; }
		#panel section { padding: 6px 0; border-bottom: 1px solid var(--line); }
		#panel section:last-of-type { border-bottom: none; }
		#panel .title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
		#panel .title.small { font-size: 13px; }
		#panel .sub { font-weight: 600; }
		#panel .hover { color: var(--dim); padding-top: 4px; font-size: 12px; }
		#panel .actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; align-items: center; }
		#panel .actions button { padding: 4px 8px; }
		#panel .reward { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
		#panel .store { margin-top: 3px; }
		.bar { position: relative; height: 14px; background: rgba(255, 255, 255, 0.08); border-radius: 7px; overflow: hidden; margin: 4px 0; }
		.bar span { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #3f9a4f, #7ee08a); }
		.bar em { position: relative; font-size: 10px; font-style: normal; padding-left: 8px; }

		#minimapPanel { right: 8px; bottom: 8px; padding: 5px; line-height: 0; }
		#minimap { cursor: pointer; border-radius: 4px; touch-action: none; }
		#stats { right: 8px; top: 58px; padding: 6px 10px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.5; pointer-events: none; }
		#stats b { color: #9fd3ff; font-weight: normal; }

		#toasts { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); z-index: 160; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
		.toast { background: var(--bg); border: 1px solid var(--line); border-left: 4px solid #5b93ee; border-radius: 6px; padding: 7px 12px; font-size: 13px; max-width: 460px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); transition: opacity 0.5s; }
		.toast.good { border-left-color: var(--good); }
		.toast.bad { border-left-color: var(--bad); }
		.toast.fade { opacity: 0; }

		#tips { left: 50%; bottom: 8px; transform: translateX(-50%); width: 420px; max-width: calc(100vw - 16px); padding: 10px 12px; border-color: rgba(255, 215, 106, 0.5); z-index: 120; }
		#tips .tip-title { color: var(--gold); font-weight: 700; margin-bottom: 4px; }
		#tips .actions { display: flex; gap: 6px; margin-top: 8px; }

		#modal { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 200; display: flex; align-items: center; justify-content: center; }
		.modal-box { position: relative; background: #121c2b; border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; max-width: min(1000px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow: auto; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
		.modal-box h3 { margin: 0 0 10px; }
		.modal-box h4 { margin: 12px 0 6px; color: var(--dim); font-weight: 600; }
		.modal-box .close { position: absolute; top: 8px; right: 10px; background: transparent; border: none; font-size: 22px; }
		.modal-box table { border-collapse: collapse; width: 100%; }
		.modal-box td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
		.modal-box .cols { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
		.modal-box .menu-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
		.modal-box .opts > div { margin: 6px 0; }
		.techs { position: relative; display: grid; grid-template-columns: repeat(4, minmax(170px, 1fr)); gap: 12px 44px; }
		.tier { position: relative; z-index: 1; }
		.tech-links { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }
		.tech-links path { fill: none; stroke-width: 1.6; transition: stroke 0.15s, stroke-width 0.15s; }
		.tech-links path.locked { stroke: rgba(150, 170, 200, 0.28); }
		.tech-links path.open { stroke: rgba(255, 215, 106, 0.7); }
		.tech-links path.done { stroke: rgba(74, 170, 96, 0.75); }
		.tech-links path.path { stroke: var(--gold); stroke-width: 2.6; }
		.tech-links path.hot { stroke: #fff; stroke-width: 2.6; }
		.tier .tech.locked, .tier .tech.poor { background: #182435; color: #7f8ea3; }
		.tier .tech.done { cursor: default; }
		.tier .tech.locked small, .tier .tech.poor small { color: #66758a; }
		.tier { display: flex; flex-direction: column; gap: 6px; }
		.tier .tech { position: relative; text-align: left; padding: 6px 10px; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 6px; background: #23344b; cursor: pointer; }
		.tier .tech:hover { background: #2d4463; }
		.tier .tech small { display: block; color: var(--dim); font-size: 10px; }
		.tier .tech .buy { position: absolute; top: 5px; right: 6px; padding: 1px 6px; font-size: 10px; font-weight: 700; background: #2b6a3a; border-color: #4ade80; color: #eafff0; }
		.tier .tech .buy.chain { background: #6a5a1f; border-color: var(--gold); color: #fff6d8; }
		.tier .tech .buy:hover:not(:disabled) { filter: brightness(1.2); }
		.tier .tech .buy:disabled { opacity: 0.55; background: #2a3445; border-color: rgba(255, 255, 255, 0.2); color: var(--dim); }
		.tech-note .bad { color: #ff8a80; }
		.tech-detail { position: sticky; bottom: -16px; margin: 12px -20px -16px; padding: 10px 20px 14px; background: #0f1826; border-top: 1px solid var(--line); z-index: 2; }
		.tech-detail.empty { padding: 10px 20px; }
		.tech-detail h4 { margin: 0 0 8px; color: var(--gold); }
		.unlock-row { display: flex; gap: 14px; align-items: flex-start; }
		.unlocks { display: flex; gap: 8px; flex-wrap: wrap; }
		.unlock { display: flex; flex-direction: column; align-items: center; width: 86px; padding: 4px; background: #16202e; border-color: rgba(255, 255, 255, 0.14); }
		.unlock.on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 215, 106, 0.3); }
		.unlock img { width: 72px; height: 72px; border-radius: 4px; }
		.unlock .icon { display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; font-size: 34px; }
		.unlock span { font-size: 11px; font-weight: 600; text-align: center; line-height: 1.2; }
		.unlock small { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; }
		.unlock-info { flex: 1; min-width: 220px; font-size: 13px; line-height: 1.45; }
		.unlock-info .unit-stats { margin: 4px 0; font-weight: 600; }
		.tier .tech b { display: block; }
		.tier .tech.done { background: #1e4a2c; border-color: #3f9a4f; opacity: 1; }
		.tier .tech.ready { border-color: var(--gold); }
		.tier .tech.focus { opacity: 1; border: 2px solid var(--gold); box-shadow: 0 0 0 3px rgba(255, 215, 106, 0.35), 0 0 16px rgba(255, 215, 106, 0.45); animation: tech-pulse 1.4s ease-in-out 3; }
		.tier .tech.path { opacity: 1; border: 2px dashed #7cb7ff; }
		@keyframes tech-pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 215, 106, 0.15), 0 0 24px rgba(255, 215, 106, 0.6); } }
		.tech-note b { display: inline; }
		.tier .tech small.need { color: var(--gold); font-weight: 700; }
		.tech-note { margin: -4px 0 10px; padding: 6px 10px; background: rgba(255, 215, 106, 0.1); border-left: 3px solid var(--gold); border-radius: 4px; }
		.locked-option { display: inline-block; padding: 4px 8px; border: 1px dashed rgba(255, 255, 255, 0.22); border-radius: 6px; color: var(--dim); }
		.locked-option small { display: block; font-size: 10px; }
		a.tech-link { color: #7cb7ff; text-decoration: underline; cursor: pointer; }
		a.tech-link:hover { color: var(--gold); }
		/* Diplomacy */
		.modal-box.diplomacy { width: min(840px, calc(100vw - 24px)); }
		.pill { display: inline-block; padding: 0 9px; border-radius: 999px; font-size: 11px; line-height: 19px; white-space: nowrap; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.16); color: var(--text); }
		.pill.war { background: rgba(229, 72, 77, 0.16); border-color: rgba(229, 72, 77, 0.6); color: #ff9da0; }
		.pill.ally { background: rgba(80, 190, 110, 0.16); border-color: rgba(80, 190, 110, 0.6); color: #95e2aa; }
		.pill.warn { border-color: rgba(255, 190, 90, 0.6); color: var(--warn); }
		.mood-friendly { color: #95e2aa; }
		.mood-cordial { color: #c6e6a0; }
		.mood-neutral { color: var(--dim); }
		.mood-wary { color: var(--warn); }
		.mood-hostile { color: #ff9da0; }
		.dp-inbox { margin-bottom: 14px; padding: 6px 12px; border-radius: 8px; background: rgba(255, 215, 106, 0.07); border: 1px solid rgba(255, 215, 106, 0.35); }
		.dp-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold); margin: 2px 0; }
		.dp-offer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; }
		.dp-offer + .dp-offer { border-top: 1px solid var(--line); }
		.dp { display: grid; grid-template-columns: 210px 1fr; gap: 20px; min-height: 340px; }
		.dp-civs { display: flex; flex-direction: column; gap: 4px; padding-right: 14px; border-right: 1px solid var(--line); }
		.dp-civ { display: flex; flex-direction: column; align-items: stretch; gap: 4px; text-align: left; padding: 7px 9px; background: transparent; border-color: transparent; }
		.dp-civ:hover:not(:disabled) { background: rgba(255, 255, 255, 0.05); }
		.dp-civ.on, .dp-civ.on:hover:not(:disabled) { background: #22344d; border-color: rgba(255, 215, 106, 0.7); }
		.dp-civ-name { font-weight: 600; }
		.dp-civ-sub { display: flex; gap: 6px; align-items: center; font-size: 11px; padding-left: 17px; }
		.dp-civ-sub .pill { font-size: 10px; line-height: 16px; padding: 0 7px; }
		.dp-civ-note { font-size: 11px; color: var(--dim); padding: 4px 9px; }
		.dp-civ-note.gone { text-decoration: line-through; opacity: 0.6; }
		.dp-main { min-width: 0; }
		.dp-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
		.dp-title .swatch { width: 13px; height: 13px; }
		.dp-title .dim { font-size: 13px; font-weight: 400; }
		.dp-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
		.dp-facts { display: grid; grid-template-columns: 72px 1fr; gap: 5px 10px; margin: 0 0 16px; font-size: 12px; }
		.dp-facts dt { color: var(--dim); }
		.dp-facts dd { margin: 0; }
		.dp-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
		.dp-tabs button { background: transparent; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 14px; color: var(--dim); }
		.dp-tabs button:hover:not(:disabled) { background: transparent; color: var(--text); }
		.dp-tabs button.on { color: var(--text); border-bottom-color: var(--gold); font-weight: 600; }
		.dp-rows { display: flex; flex-direction: column; }
		.dp-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
		.dp-row:last-child { border-bottom: none; }
		.dp-row-text b { display: block; font-weight: 600; }
		.dp-row-text small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
		.dp-row-ctl { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
		.dp-row-ctl button { padding: 4px 12px; font-size: 12px; min-width: 80px; }
		.dp-row-ctl select { padding: 3px 6px; font-size: 12px; }
		.dp-why { font-size: 11px; color: var(--dim); font-style: italic; max-width: 210px; text-align: right; }
		.dp-note { margin: 10px 0 4px; padding: 8px 12px; background: rgba(255, 215, 106, 0.07); border-left: 3px solid var(--gold); border-radius: 4px; font-size: 12px; }
		.dp-trade { padding: 10px 2px 4px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
		.modal-box .dp-trade table { width: auto; margin: 8px 0 4px; }
		.modal-box .dp-trade th, .modal-box .dp-trade td { padding: 3px 18px 3px 0; border: none; text-align: left; font-weight: 400; vertical-align: middle; }
		.dp-trade thead th { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
		.dp-trade input[type=number] { width: 4.5em; padding: 2px 6px; margin-right: 5px; }
		.dp-trade label.check { font-size: 12px; }
		.dp-propose { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
		.dp-foot { margin: 14px 0 0; font-size: 11px; color: var(--dim); }
		label.check { display: flex; gap: 6px; align-items: center; margin: 6px 0; font-size: 12px; }
		#dealHint { font-size: 12px; }
		.wonder-table td { font-size: 12px; }
		.ambition-grid { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 10px; }
		.ambition { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
		.ambition.on { border-color: var(--gold); background: rgba(255, 215, 106, 0.06); }
		.ambition ol { margin: 4px 0; padding-left: 18px; font-size: 12px; }
		.ambition button { align-self: flex-start; }
		#topbar button small { display: inline; }
		#unitActions { position: absolute; left: 0; top: 0; z-index: 45; display: flex; gap: 8px; will-change: transform; }
		#unitActions button { width: 40px; height: 40px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(14, 22, 34, 0.92); border: 2px solid var(--gold); color: var(--gold); box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45); }
		#unitActions button:hover { background: #2d4463; transform: scale(1.08); }
		.timers td { border: none; padding: 3px 6px 3px 0; font-size: 12px; }
		#chat { right: 8px; bottom: 150px; width: 300px; max-width: calc(100vw - 16px); padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; z-index: 110; }
		#chat .log { max-height: 220px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 3px; user-select: text; }
		#chat .line.sys { color: var(--dim); font-style: italic; }
		#chat input { width: 100%; box-sizing: border-box; }
		.help p { max-width: 640px; line-height: 1.5; }

		#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
		.city-label, .ub, .damage, .lens-label { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
		.lens-label span { display: inline-block; padding: 1px 6px; font-size: 11px; background: rgba(10, 16, 26, 0.82); border-left: 3px solid; border-radius: 4px; }
		.lens-label span.ok { border-color: #4ade80; }
		.lens-label span.wait { border-color: #60a5fa; }
		.lens-label span.idle { border-color: #f59e0b; color: #fde68a; }
		.lens-store { margin-top: 2px; text-align: center; }
		.lens-store .chip { font-size: 10px; }
		#topbar button.on { background: #2563eb; border-color: #3b82f6; color: #fff; }
		.city-label span { display: inline-block; padding: 1px 8px; font-size: 12px; font-weight: 600; background: rgba(10, 16, 26, 0.8); border: 2px solid; border-radius: 10px; }
		/* Unit badges: a shield in the owner's colour with the unit's icon, health when hurt, a star for veterans */
		.ub { display: flex; flex-direction: column; align-items: center; }
		.ub span { display: inline-flex; align-items: center; gap: 1px; height: 21px; padding: 0 5px; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.7); background: var(--c); border: 1.5px solid rgba(255, 255, 255, 0.92); border-radius: 5px 5px 10px 10px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55), 0 2px 3px rgba(0, 0, 0, 0.35); }
		.ub i { font-style: normal; font-size: 13px; line-height: 1; }
		.ub b { margin-left: 2px; font-size: 11px; }
		.ub u { text-decoration: none; color: #fde047; font-size: 10px; margin-right: 1px; }
		.ub em { display: block; width: 26px; height: 3px; margin-top: 2px; background: rgba(0, 0, 0, 0.6); border-radius: 2px; overflow: hidden; }
		.ub em s { display: block; height: 100%; background: #4ade80; text-decoration: none; }
		.damage { font: 700 18px system-ui, sans-serif; color: #ffd84d; text-shadow: 0 0 3px #000, 0 0 6px #000; }

		#setup { position: absolute; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #1d3557, #0b1220); overflow: auto; }
		.setup-box { background: rgba(10, 16, 26, 0.92); border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px; width: 760px; max-width: calc(100vw - 24px); }
		.setup-box h1 { margin: 0; color: var(--gold); letter-spacing: 3px; }
		.setup-box .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 16px; margin-top: 12px; }
		.setup-box label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); }
		.setup-box label.check { flex-direction: row; align-items: center; gap: 6px; color: var(--text); font-size: 13px; }
		.setup-box .checks { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; }
		.setup-box .setup-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }

		@media (max-width: 760px) {
			#infoPanel { width: auto; right: 8px; bottom: 150px; max-height: 38vh; }
			#minimapPanel { transform: scale(0.7); transform-origin: bottom right; }
			.techs { grid-template-columns: repeat(2, 1fr); }
			.dp, .ambition-grid { grid-template-columns: 1fr; min-width: 0; }
			.dp-civs { flex-direction: row; flex-wrap: wrap; border-right: none; padding-right: 0; }
			.setup-box .grid, .modal-box .cols { grid-template-columns: 1fr; }
		}
		@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
	</style>
</head>
<body>
	<div id="labels" aria-hidden="true"></div>
	<div id="unitActions" class="hidden" role="toolbar" aria-label="Unit actions"></div>

	<nav id="topbar" class="panel" aria-label="Game controls">
		<span class="title">HEX REALMS</span>
		<span id="civ"></span>
		<span id="starsBox" title="Stars: spend them on research, buildings, roads and units"></span>
		<span id="turnBox"></span>
		<button data-action="modal" data-modal="tech" title="Research (R)">Research</button>
		<button id="btnCities" data-action="modal" data-modal="cities" title="Your cities (L)">Cities</button>
		<button data-action="modal" data-modal="economy" title="Economy (B)">Economy</button>
		<button id="btnLens" data-action="lens" title="Economy lens: building states and city stores on the map (V)">Lens</button>
		<button id="btnDiplo" data-action="modal" data-modal="diplomacy" title="Diplomacy (G)">Diplomacy</button>
		<button id="btnAmbition" data-action="modal" data-modal="ambitions" title="Ambition: your goal and the race board (J)">Ambition</button>
		<button id="btnWonders" data-action="modal" data-modal="wonders" title="Wonders and monuments (M)">Wonders</button>
		<button id="btnChat" class="hidden" data-action="chat" title="Chat with the other players">Chat</button>
		<span class="spacer"></span>
		<button id="styleToggle" data-action="style" title="Switch terrain look (T)">Terrain</button>
		<button data-action="modal" data-modal="menu" title="Menu (O)">Menu</button>
		<button data-action="nextunit" title="Next unit (Space)">Next Unit</button>
		<button id="endTurn" class="primary" data-action="endturn" title="End your turn (Enter)">End Turn</button>
	</nav>

	<div id="stats" class="panel hidden">
		<div>FPS <b id="fps">0</b></div>
		<div>Map <b id="mapInfo">-</b></div>
		<div>Terrain <b id="chunkInfo">-</b></div>
		<div>Draws <b id="drawCalls">-</b></div>
		<div>Build <b id="timings">-</b></div>
	</div>

	<div id="toasts" role="status" aria-live="polite"></div>

	<aside id="infoPanel" class="panel" aria-label="Selection">
		<div id="panel"></div>
	</aside>

	<div id="tips" class="panel hidden" role="note"></div>

	<div id="minimapPanel" class="panel">
		<canvas id="minimap" aria-label="Minimap: click to move the camera"></canvas>
	</div>

	<div id="chat" class="panel hidden" aria-label="Chat"><div class="log" role="log" aria-live="polite"></div><input id="chatInput" maxlength="300" placeholder="Say something, then Enter" autocomplete="off"></div>
	<div id="modal" class="hidden" role="dialog" aria-modal="true"></div>
	<div id="setup" class="hidden"></div>

	<div class="igeLoading loadingFloat">
		<div class="loadingLogo"></div>
		<div class="loadingCircle"></div>
		<div class="loadingCircleInner"></div>
		<div class="loadingText" id="loadingText">Loading Hex Realms...</div>
		<div id="loadingProgress"><div id="loadingProgressBar"></div></div>
	</div>
	<div class="igeLoading loadingLink">Powered By Isogenic Game Engine</div>
</body>
</html>
